[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gsv-tts-lite"
version = "0.4.7"
authors = [
  { name="mahir0", email="2370950583@qq.com" },
]
description = "A high-performance inference engine specifically designed for the GPT-SoVITS text-to-speech model"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "einops",
    "tqdm",
    "av",
    "transformers",
    "sounddevice",
    "safetensors",
    "numpy",
    "py3langid",
    "pysbd",
    "onnxruntime",
    "soundfile",
    "requests",
    "nltk",
    "future",
    "inflect",
    "wordsegment",
    "pypinyin",
    "jieba",
    "pyopenjtalk-plus",
]

[project.urls]
"Homepage" = "https://github.com/chinokikiss/GSV-TTS-Lite"

[project.scripts]
gsv-tts = "gsv_tts.__main__:main"

[tool.setuptools.packages.find]
include = ["gsv_tts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# test_sovits_sharing.py 是需真实模型/网络的脚本式测试，仅手动运行
addopts = "--ignore=tests/test_sovits_sharing.py"
